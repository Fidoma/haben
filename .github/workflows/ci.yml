name: CI

# Reine Doku-Änderungen bauen nicht. Auf main filtert paths-ignore. Für Pull Requests geht das nicht: Ohne Lauf
# bleiben die auf main geforderten Checks „Pending“ und blockieren den Merge (GitHub-Doku „Troubleshooting required
# status checks“, „Handling skipped but required checks“). Dort überspringt deshalb der Job changes die Prüfungen.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Der Release-Workflow lässt vor dem Veröffentlichen dieselben Prüfungen laufen.
  workflow_call:

# Standard für alle Jobs; Jobs, die mehr brauchen, setzen eigene permissions
permissions:
  contents: read

# Ein neuer Push bricht den veralteten Lauf desselben Pull Requests oder von main ab: Der neue Stand enthält den alten.
# Das Release (workflow_call) hat eine eigene Gruppe und läuft immer zu Ende
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  # Stellt fest, ob ein Pull Request nur Markdown, docs/ oder LICENSE ändert. Ein Job, der per if übersprungen wird,
  # zählt für die Regeln auf main als Erfolg, auch wenn er nur wegen eines fehlgeschlagenen needs-Jobs ausfällt. Darum
  # steht in jedem Job !cancelled() und der Vergleich mit 'false': Läuft changes nicht (push, Release, Entwurf) oder
  # schlägt fehl, ist die Ausgabe leer und die Prüfungen laufen
  # Auf main vergleicht er mit dem Stand vor dem Push; dort laufen container und dev-compose immer (Ausgabe leer)
  changes:
    if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.draft) || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      einvoice: ${{ steps.filter.outputs.einvoice }}
      deploy: ${{ steps.filter.outputs.deploy }}
      bild: ${{ steps.filter.outputs.bild }}
    steps:
      # Der Merge-Commit des Pull Requests und sein erster Elternteil, die Basis
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: filter
        run: |
          set -euo pipefail
          # Pull Request: Merge-Commit gegen seine Basis; Push auf main: gegen den Stand vor dem Push
          if [ "${EREIGNIS:-}" = push ]; then
            before="${VORHER:-}"
            if [ -z "$before" ] || [ "$before" = 0000000000000000000000000000000000000000 ] || ! git fetch -q --depth=1 origin "$before"; then
              # Ohne Vergleichsstand läuft alles
              { echo code=true; echo einvoice=true; echo deploy=true; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            base="$before"
          else
            base=HEAD^1
          fi
          # --no-renames: Eine umbenannte Datei zählt mit altem und neuem Pfad, Code wird nicht durch Verschieben zu Doku
          changed="$(git -c core.quotePath=false diff --no-renames --name-only "$base" HEAD)"
          printf '%s\n' "$changed"
          other="$(grep -Ev '\.md$|^docs/|^LICENSE$' <<< "$changed" || true)"
          # Gelöscht oder verschoben zählt als Code: normen.test.ts verlangt die Seiten aus scripts/jahreswerte/normen.json
          deleted="$(git diff --no-renames --diff-filter=D --name-only "$base" HEAD)"
          if [ -n "$changed" ] && [ -z "$other" ] && [ -z "$deleted" ]; then code=false; else code=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # Ob etwas die E-Rechnung (Jobs kosit, zugferd) oder die Images und Migrationen der Nutzer (backup, db-upgrade)
          # ändern kann; dazu immer die Abhängigkeiten und dieser Workflow (Versionen der Prüfer)
          always='^(bun\.lock|package\.json|\.github/workflows/ci\.yml)$'
          if grep -Eq "^packages/(einvoice|core)/|$always" <<< "$changed"; then einvoice=true; else einvoice=false; fi
          if grep -Eq "^deploy/|^apps/web/drizzle/|$always" <<< "$changed"; then deploy=true; else deploy=false; fi
          echo "einvoice=$einvoice" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          # container und dev-compose im Pull Request nur, wenn Image (mit scripts/container/: Inhalt und Prüfungen),
          # Compose oder Abhängigkeiten sich ändern; auf main immer (Ausgabe leer), dort fällt ein Build-Fehler aus dem
          # App-Code spätestens auf
          if [ "${EREIGNIS:-}" != push ]; then
            if grep -Eq "Containerfile$|(^|/)compose[^/]*\.ya?ml$|^deploy/|^scripts/container/|$always" <<< "$changed"; then bild=true; else bild=false; fi
            echo "bild=$bild" >> "$GITHUB_OUTPUT"
          fi
        # Als Umgebung statt ${{ }} im Skript, damit scripts/ci/doku-filter.test.ts den Block unverändert ausführen kann
        env:
          EREIGNIS: ${{ github.event_name }}
          VORHER: ${{ github.event.before }}

  # Lint und Typecheck brauchen keine Datenbank; gebaut wird in den Jobs e2e-teil
  check:
    # Draft-Pull-Requests bauen nicht; "Ready for review" startet den Lauf
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # Ausgabe von /api/metrics mit dem Parser von Prometheus selbst (#1858)
      - run: bun scripts/metriken/beispiel.ts | docker run --rm -i --entrypoint promtool prom/prometheus:v3.5.0 check metrics
      # Alarmregeln für dieselben Metriken mit ihren Unit-Tests (#1871)
      - run: docker run --rm -v "$PWD:/w:ro" -w /w --entrypoint promtool prom/prometheus:v3.5.0 test rules scripts/metriken/regeln.test.yml

  # Vier Teile parallel (Vitest --shard); jeder migriert seine eigene Vorlage
  test-teil:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        teil: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_USER: haben
          POSTGRES_PASSWORD: haben
          POSTGRES_DB: haben_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U haben -d haben_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Die Datenbank ist nach dem Job weg: ohne Schreiben auf die Platte bei jedem Commit
      - name: PostgreSQL ohne fsync
        run: docker exec ${{ job.services.postgres.id }} psql -U haben -d haben_test -qc "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      # Ubuntu-Mirror fallen auf den Runnern zeitweise aus („Could not wait for server fd“): apt versucht es mehrmals
      - run: printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-wiederholen >/dev/null
      # pdftoppm wandelt PDFs für einen selbst betriebenen KI-Dienst in Seitenbilder (wie im Image)
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils
      # Jeder Worker von Vitest klont seine Datenbank aus einer Vorlage (apps/web/src/server/test-db.ts)
      - name: Tests, Teil ${{ matrix.teil }} von 4
        run: bun run test --shard=${{ matrix.teil }}/4
        env:
          TEST_DATABASE_URL: postgres://haben:haben@localhost:5432/haben_test

  # Die Prüfsumme der Sperren (#1683) muss auf jeder Unterversion von PostgreSQL 19 dieselbe sein wie in den Release Notes.
  # test-teil prüft sie auf der neuesten (postgres:19, wie das Image tristanteu/haben-db), dieser Job auf der ältesten.
  sollbestand-postgres:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19.0
        env:
          POSTGRES_USER: haben
          POSTGRES_PASSWORD: haben
          POSTGRES_DB: haben_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U haben -d haben_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Prüfsumme der Sperren auf PostgreSQL 19.0
        run: bun --bun vitest run apps/web/src/server/db/trigger-inventory.pruefsumme.test.ts
        env:
          TEST_DATABASE_URL: postgres://haben:haben@localhost:5432/haben_test

  # Ein Ergebnis für die Regeln auf main (geforderter Check „test“), egal in wie viele Teile die Tests zerfallen.
  # always() auch nach einem Abbruch, damit ein abgebrochener Pull-Request-Lauf nicht als übersprungen = grün zählt;
  # auf main (push) gibt es kein Merge-Gate, dort bleibt ein abgebrochener Lauf grau statt rot. Gilt auch für e2e
  test:
    if: ${{ always() && (github.event_name != 'push' || !cancelled()) && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    needs: [changes, test-teil, sollbestand-postgres]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test-teil.result }}" = success
      - run: test "${{ needs.sollbestand-postgres.result }}" = success

  # Tag des CI-Images für die E2E-Jobs (.github/ci-image, gebaut von ci-image.yml) und ob es ihn auf ghcr.io schon
  # gibt. Ändert ein Pull Request Containerfile, Playwright- oder Bun-Version, fehlt das Image bis zum Bau auf main;
  # dann laufen die E2E-Jobs ohne Container und holen Browser und Pakete selbst (#1742)
  ci-image:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.pruefen.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: pruefen
        run: |
          set -euo pipefail
          image="ghcr.io/speicherstadt/haben-ci:$(.github/ci-image/tag.sh | sed -n 's/^tag=//p')"
          # Ohne Anmeldung, wie der Job im Container: ein privates Paket zählt als fehlend
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "image=$image" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$image fehlt, E2E ohne CI-Image"
          fi

  # Feste Teile parallel: welche Projekte in welchem Teil laufen, steht in apps/web/e2e/durchlaeufe.ts (TEILE);
  # jeder Teil startet nur seine Server. Dazu SSO als eigener Teil. Gebaut wird in jedem Teil, das läuft parallel
  # und braucht kein Artefakt dazwischen
  e2e-teil:
    needs: [changes, ci-image]
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # Leer heißt ohne Container, direkt auf dem Runner
    container: ${{ needs.ci-image.outputs.image }}
    env:
      # Im Container erreicht man den Service über seinen Namen, auf dem Runner über den weitergeleiteten Port
      DB_HOST: ${{ needs.ci-image.outputs.image != '' && 'postgres' || 'localhost' }}
      CI_IMAGE: ${{ needs.ci-image.outputs.image }}
    strategy:
      fail-fast: false
      matrix:
        teil: [belege-steuern, rechnungen, ablauf, ablauf-2, ablauf-3, gmbh, importe, sso]
    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_USER: haben
          POSTGRES_PASSWORD: haben
          POSTGRES_DB: haben_e2e
          # Je Server des Teils (e2e/durchlaeufe.ts) bis zu elf Verbindungen (Pool und Sperre), in einem Teil dazu
          # die Server für Beenden und verzögerte Anfragen; Standard sind 100.
          POSTGRES_INITDB_ARGS: "--set=max_connections=400"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U haben -d haben_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # Ab hier bis zu poppler-utils nur ohne CI-Image: Bun, Chromium, Systembibliotheken und pdftotext bringt es mit
      - if: env.CI_IMAGE == ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Ubuntu-Mirror fallen auf den Runnern zeitweise aus („Could not wait for server fd“): apt versucht es mehrmals
      - if: env.CI_IMAGE == ''
        run: printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-wiederholen >/dev/null
      # Chromium aus dem Cache, je Playwright-Version; die Systembibliotheken kommen bei jedem Lauf
      - id: playwright
        if: env.CI_IMAGE == ''
        working-directory: apps/web
        run: echo "version=$(bun --bun playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        if: env.CI_IMAGE == ''
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium
      - if: env.CI_IMAGE == '' && steps.browsers.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: bun --bun playwright install --with-deps chromium
      - if: env.CI_IMAGE == '' && steps.browsers.outputs.cache-hit == 'true'
        working-directory: apps/web
        run: bun --bun playwright install-deps chromium
      # psql aus dem CI-Image, auf dem Runner das im Service-Container
      - name: PostgreSQL ohne fsync
        env:
          PGPASSWORD: haben
        run: ${{ env.CI_IMAGE == '' && format('docker exec {0}', job.services.postgres.id) || '' }} psql -h "$DB_HOST" -U haben -d haben_e2e -qc "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      # pdftotext prüft beim Hochladen eines eigenen Layouts die Pflichtangaben (wie im Image)
      - if: env.CI_IMAGE == ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils
      - run: bun run build
      - run: echo "E2E_START=$(date +%s)" >> "$GITHUB_ENV"
      # Vier Worker (playwright.config.ts), so viele Kerne hat der Runner
      - name: Ende-zu-Ende-Tests, Teil ${{ matrix.teil }}
        if: matrix.teil != 'sso'
        run: bun run e2e
        env:
          E2E_TEIL: ${{ matrix.teil }}
          E2E_DATABASE_URL: postgres://haben:haben@${{ env.DB_HOST }}:5432/haben_e2e
          E2E_APP_DATABASE_URL: postgres://haben_e2e_app:erfundenes-e2e-passwort@${{ env.DB_HOST }}:5432/haben_e2e
          # Der gebaute Server statt des Entwicklungsservers
          E2E_SERVER_COMMAND: bun .output/server/index.mjs
      - name: SSO-Ende-zu-Ende mit Produktionsbuild und TLS
        if: matrix.teil == 'sso'
        run: bun run e2e --config playwright.sso-only.config.ts
        env:
          E2E_DATABASE_URL: postgres://haben:haben@${{ env.DB_HOST }}:5432/haben_sso_e2e
          E2E_APP_DATABASE_URL: postgres://haben_e2e_app:erfundenes-e2e-passwort@${{ env.DB_HOST }}:5432/haben_sso_e2e
          E2E_SERVER_COMMAND: bun .output/server/index.mjs
      # Budget je Teil 5 Minuten (docs/entwicklung.md, Tests): ab 4:30 eine Warnung, kein Fehlschlag
      - name: Dauer des Teils
        if: always() && env.E2E_START != ''
        run: |
          dauer=$(( $(date +%s) - E2E_START ))
          echo "E2E-Teil ${{ matrix.teil }}: $((dauer / 60)):$(printf %02d $((dauer % 60))) min" >> "$GITHUB_STEP_SUMMARY"
          if [ "$dauer" -gt 270 ]; then echo "::warning::E2E-Teil ${{ matrix.teil }} brauchte ${dauer} s, Budget 300 s"; fi
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-bericht-teil-${{ matrix.teil }}
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore

  # Ein Ergebnis für die Regeln auf main (geforderter Check „e2e“), egal in wie viele Teile die Tests zerfallen
  e2e:
    if: ${{ always() && (github.event_name != 'push' || !cancelled()) && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    needs: [changes, e2e-teil]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.e2e-teil.result }}" = success

  kosit:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' && needs.changes.outputs.einvoice != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - run: bun install --frozen-lockfile
      - name: KoSIT-Validator und XRechnung-Konfiguration laden
        env:
          GH_TOKEN: ${{ github.token }}
          # Die Releases, gegen die die E-Rechnungen geprüft werden; Renovate hebt sie
          # (.github/renovate.json5)
          KOSIT_VALIDATOR: v1.6.3
          KOSIT_XRECHNUNG: v2026-08-31
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kosit/dl" "$RUNNER_TEMP/kosit/validator" "$RUNNER_TEMP/kosit/xr"
          # Die Dateinamen wechseln zwischen den Releases: bis 1.5 validator-x-distribution.zip mit
          # validationtool-x-standalone.jar darin, ab 1.6.1 validator-x-standalone.jar als eigene Datei
          gh release download "$KOSIT_VALIDATOR" --repo itplr-kosit/validator \
            --pattern 'validator-*.zip' --pattern '*-standalone.jar' --dir "$RUNNER_TEMP/kosit/dl"
          for zip in "$RUNNER_TEMP"/kosit/dl/*.zip; do unzip -q "$zip" -d "$RUNNER_TEMP/kosit/validator"; done
          find "$RUNNER_TEMP/kosit/dl" -maxdepth 1 -name '*-standalone.jar' -exec cp {} "$RUNNER_TEMP/kosit/validator/" \;
          # Die Konfiguration: das ZIP mit scenarios.xml (xrechnung-x-validator-configuration-datum.zip,
          # bis 2025 validator-configuration-xrechnung_x_datum.zip)
          gh release download "$KOSIT_XRECHNUNG" --repo itplr-kosit/validator-configuration-xrechnung \
            --pattern '*.zip' --dir "$RUNNER_TEMP/kosit/dl-xr"
          for zip in "$RUNNER_TEMP"/kosit/dl-xr/*.zip; do
            if unzip -Z1 "$zip" | grep -qx 'scenarios.xml'; then unzip -q "$zip" -d "$RUNNER_TEMP/kosit/xr"; break; fi
          done
          [ -f "$RUNNER_TEMP/kosit/xr/scenarios.xml" ] || { echo "::error::$KOSIT_XRECHNUNG: kein ZIP mit scenarios.xml"; exit 1; }
          jar="$(find "$RUNNER_TEMP/kosit/validator" -name '*-standalone.jar' ! -name '*java8*' | head -n1)"
          [ -n "$jar" ] || { echo "::error::$KOSIT_VALIDATOR: kein *-standalone.jar"; exit 1; }
          echo "KOSIT_JAR=$jar" >> "$GITHUB_ENV"
          echo "KOSIT_CONFIG=$RUNNER_TEMP/kosit/xr/scenarios.xml" >> "$GITHUB_ENV"
      - run: bun run --cwd packages/einvoice kosit "$RUNNER_TEMP/kosit/out"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kosit-reports
          path: ${{ runner.temp }}/kosit/out
          if-no-files-found: ignore

  # Die ZUGFeRD-PDFs: PDF/A-3 (veraPDF) und factur-x.xml nach Factur-X, mit dem Mustang-Validator
  zugferd:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' && needs.changes.outputs.einvoice != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - run: bun install --frozen-lockfile
      - name: Mustang-Validator laden
        env:
          GH_TOKEN: ${{ github.token }}
          # Renovate hebt die Version (.github/renovate.json5)
          MUSTANG: core-2.26.0
        run: |
          set -euo pipefail
          gh release download "$MUSTANG" --repo ZUGFeRD/mustangproject --pattern 'Mustang-CLI-*.jar' --dir "$RUNNER_TEMP/mustang"
          jar="$(find "$RUNNER_TEMP/mustang" -name 'Mustang-CLI-*.jar' | head -n1)"
          [ -n "$jar" ] || { echo "::error::$MUSTANG: kein Mustang-CLI-*.jar"; exit 1; }
          echo "MUSTANG_JAR=$jar" >> "$GITHUB_ENV"
      - run: bun run --cwd packages/einvoice zugferd "$RUNNER_TEMP/zugferd"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zugferd-berichte
          path: ${{ runner.temp }}/zugferd
          if-no-files-found: ignore

  container:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' && needs.changes.outputs.bild != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Den Build-Cache schreibt nur das Release: sonst könnte ein Pull Request Schichten
      # hineinlegen, die das nächste Release-Image übernimmt
      packages: read
    steps:
      - uses: actions/checkout@v7
      # Liest den Build-Cache des Releases: nur geänderte Schichten werden neu gebaut
      - name: Image bauen
        uses: firsttris/workflows/actions/docker-build@5011fb6bf2b7423d211ecffa82218ba067fb5fed # main
        with:
          dockerfile: Containerfile
          tags: haben:ci
      # Firmenportal (#504, Stufe 2): Image bauen, mit gültiger Konfiguration gesund, mit ungültiger startet es nicht
      - name: Firmenportal
        run: |
          set -x
          docker build -f apps/firmenportal/Containerfile -t haben-firmenportal:ci .
          docker run -d --name haben-firmenportal-ci -p 127.0.0.1:3010:3000 \
            -e PORTAL_URL=https://portal.haben.test -e PORTAL_SECRET="$(openssl rand -base64 32)" \
            -e OIDC_ISSUER=https://auth.haben.test -e OIDC_CLIENT_ID=firmenportal -e OIDC_CLIENT_SECRET=geheim \
            -e PORTAL_FIRMEN='Firma 1|https://firma1.haben.test|haben-firma1-inhaber' haben-firmenportal:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3010/gesund && break; sleep 1; done
          test "$(curl -sf http://127.0.0.1:3010/gesund)" = ok
          # Ohne Sitzung gleich zur Anmeldung, nach dem Abmelden die Seite dazu; die Schrift liefert das Firmenportal selbst
          test "$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:3010/)" = http://127.0.0.1:3010/anmelden
          curl -sf 'http://127.0.0.1:3010/?abgemeldet' | grep -q 'href="/anmelden"'
          test "$(curl -sf -o /dev/null -w '%{content_type}' http://127.0.0.1:3010/schrift/plex-400.woff2)" = font/woff2
          for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' haben-firmenportal-ci)" = healthy ] && break; sleep 2; done
          test "$(docker inspect -f '{{.State.Health.Status}}' haben-firmenportal-ci)" = healthy
          docker rm -f haben-firmenportal-ci
          ! docker run --rm -e PORTAL_URL=http://portal.haben.test haben-firmenportal:ci
      - name: Ausgelieferte Compose-Konfiguration mit App-Rolle und Legacy-Zugang prüfen
        run: bash deploy/tests/rollen-start.sh
        env:
          COMPOSE_PROJECT_NAME: haben-ci-rollen
          HABEN_TEST_PORT: 3000
      # Werkzeug für mehrere Instanzen (#504) mit dem Image dieses Laufs: zwei Firmen, getrennte Datenbanken.
      # Es läuft wie beim Betreiber mit Bun direkt aus dem Checkout, ohne bun install
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Mehrere Instanzen
        env:
          HABEN_INSTANZEN: ${{ runner.temp }}/haben
        run: |
          set -x
          docker tag haben:ci tristanteu/haben:latest
          bun deploy/instanzen/haben-instanzen.ts neu firma1 firma1.haben.test
          # Die zweite Instanz baut den gemeinsamen Caddy nicht neu auf (#1013): derselbe Container, und er antwortet für
          # firma1 durchgehend. Ohne Zertifikat leitet er HTTP auf HTTPS um (308); 000 hieße: keine Verbindung
          caddy_id="$(cd "$HABEN_INSTANZEN/proxy" && docker compose ps -q caddy)"
          (set +x; while :; do curl -s -o /dev/null -m 2 -w '%{http_code}\n' -H 'Host: firma1.haben.test' http://127.0.0.1/; sleep 0.1; done) > "$RUNNER_TEMP/antworten.txt" &
          schleife=$!
          bun deploy/instanzen/haben-instanzen.ts neu firma2 firma2.haben.test
          kill "$schleife"
          test "$(cd "$HABEN_INSTANZEN/proxy" && docker compose ps -q caddy)" = "$caddy_id"
          test "$(grep -c . "$RUNNER_TEMP/antworten.txt")" -gt 10
          test -z "$(grep -v '^308$' "$RUNNER_TEMP/antworten.txt")"
          # Firma wechseln (#909): firmen schreibt die Liste in beide, startet die Apps neu und wartet, bis sie gesund sind
          bun deploy/instanzen/haben-instanzen.ts firmen
          for f in firma1 firma2; do
            test "$(cd "$HABEN_INSTANZEN/$f" && docker compose exec -T app printenv HABEN_FIRMEN)" = "firma1|https://firma1.haben.test;firma2|https://firma2.haben.test"
            test "$(cd "$HABEN_INSTANZEN/$f" && docker compose ps app --format '{{.Health}}')" = healthy
          done
          # Ein Beleg in Firma 1 ist in Firma 2 nicht zu finden
          sha="$(echo beleg | sha256sum | cut -d' ' -f1)"
          (cd "$HABEN_INSTANZEN/firma1" && docker compose exec -T db psql -U haben -d haben -qc \
            "INSERT INTO documents (sha256, filename, mime_type, size, net, tax, gross) VALUES ('$sha', 'beleg.pdf', 'application/pdf', 6, 0, 0, 0)")
          test "$(cd "$HABEN_INSTANZEN/firma1" && docker compose exec -T db psql -U haben -d haben -Atc 'SELECT count(*) FROM documents')" = 1
          test "$(cd "$HABEN_INSTANZEN/firma2" && docker compose exec -T db psql -U haben -d haben -Atc 'SELECT count(*) FROM documents')" = 0
          # Die App läuft als eingeschränkte Rolle haben_app, nicht als Eigentümer (#816)
          (cd "$HABEN_INSTANZEN/firma1" && docker compose exec -T app sh -c 'case "$DATABASE_URL" in postgres://haben_app:*) ;; *) exit 1 ;; esac')
          test "$(cd "$HABEN_INSTANZEN/firma1" && docker compose exec -T db psql -U haben -d haben -Atc "SELECT count(*) FROM pg_roles WHERE rolname = 'haben_app' AND NOT rolsuper")" = 1
          # Der Befehl haben im Image nennt die Version aus package.json, status zeigt sie je Instanz
          version="$(cd "$HABEN_INSTANZEN/firma1" && docker compose exec -T app haben status --json | jq -r .version)"
          test "$version" = "$(jq -r .version package.json)"
          # Ohne Build-Argument HABEN_COMMIT startet das Image und meldet keinen Commit; mit HABEN_COMMIT steht die kurze
          # Kennung hinter der Version (#887)
          test "$(cd "$HABEN_INSTANZEN/firma1" && docker compose exec -T app haben status --json | jq -r .commit)" = null
          # Speicher (#951): pg_database_size als eingeschränkte Rolle haben_app, Belege als Benutzer der App
          (cd "$HABEN_INSTANZEN/firma1" && docker compose exec -T app haben status --json) | jq -e '.speicher.datenbankBytes > 0 and (.speicher.belegeBytes | type) == "number"'
          test "$(cd "$HABEN_INSTANZEN/firma1" && docker compose exec -T -e HABEN_COMMIT=0123abc4567 app haben status | head -n1)" = "Version:          $version (0123abc)"
          bun deploy/instanzen/haben-instanzen.ts status | tee "$RUNNER_TEMP/status.txt"
          grep -E "^firma1 +firma1\.haben\.test +${version//./\\.} " "$RUNNER_TEMP/status.txt"
          grep -E "^firma2 +firma2\.haben\.test +${version//./\\.} " "$RUNNER_TEMP/status.txt"
          # Zeichen der Firma für das Firmenportal (#1036): ab Werk weder Farbe noch Logo, haben kennzeichen endet mit 3
          (cd "$HABEN_INSTANZEN/firma1" && docker compose exec -T app haben status --json | jq -e '.zeichen == {"farbe": null, "logo": null}')
          rc=0; (cd "$HABEN_INSTANZEN/firma1" && docker compose exec -T app haben kennzeichen > /dev/null) || rc=$?; test "$rc" = 3
          # portal richtet das Firmenportal hinter dem gemeinsamen Caddy ein; die Instanzen hier haben kein SSO, die
          # Liste bleibt leer. Ein zweiter Aufruf ändert nichts und startet nichts neu
          docker tag haben-firmenportal:ci tristanteu/haben-firmenportal:latest
          printf geheim | bun deploy/instanzen/haben-instanzen.ts portal portal.haben.test \
            --oidc-issuer https://auth.haben.test --oidc-client-id firmenportal --oidc-client-secret-stdin
          test "$(cd "$HABEN_INSTANZEN/firmenportal" && docker compose ps firmenportal --format '{{.Health}}')" = healthy
          bun deploy/instanzen/haben-instanzen.ts portal | tee "$RUNNER_TEMP/portal.txt"
          grep -qx "Nichts geändert." "$RUNNER_TEMP/portal.txt"
          grep -q "Ohne SSO, nicht im Firmenportal: firma1 firma2" "$RUNNER_TEMP/portal.txt"
          # Ohne !: An einer mit ! verneinten Pipeline bricht bash -e nicht ab, sie zählte nur als letzte Zeile des Schritts
          if bun deploy/instanzen/haben-instanzen.ts liste | grep -q firmenportal; then echo "liste zeigt das Firmenportal" >&2; exit 1; fi
          # Eigenes Netz je Instanz (#872): Der gemeinsame Caddy erreicht jede App, die App von Firma 1 die von
          # Firma 2 nicht; auch nach einem Neuaufbau des Caddy und einem Neustart von Docker. Startet Docker neu,
          # deshalb zuletzt
          sh deploy/tests/instanzen-netze.sh "$HABEN_INSTANZEN"

  # Die Entwicklungsumgebung aus compose.yml im Hauptordner: startet sie, läuft der Dev-Server mit Datenbank
  dev-compose:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' && needs.changes.outputs.bild != 'false' }}
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: haben-ci-dev-rollen
      DATABASE_URL: postgres://haben_app:ci_app@db:5432/haben
      MIGRATION_DATABASE_URL: postgres://haben:haben@db:5432/haben
    steps:
      - uses: actions/checkout@v7
      - name: Datenbank und einmalige App-Rolle vorbereiten
        run: |
          docker compose up -d --wait db
          printf 'ci_app\nci_app\n' | docker compose exec -T db createuser -U haben --login --no-superuser --no-createdb --no-createrole --pwprompt haben_app
      # Wie unter Linux üblich: erst `docker compose up` mit der Vorgabe-ID 1000, dann nach docs/entwicklung.md
      # mit der eigenen ID neu bauen. Die Volumes gehören danach noch der alten ID; der Start muss trotzdem gehen.
      - name: Erster Start mit der Vorgabe-ID
        run: |
          docker compose up -d --build
          for i in $(seq 1 90); do docker compose logs app | grep -q "Migrationen angewendet" && break; sleep 2; done
          docker compose logs app | grep -q "Migrationen angewendet"
          docker compose down
      - name: Starten
        run: |
          # Der Runner-Benutzer hat nicht die ID 1000; der Container muss in den Projektordner schreiben dürfen
          HABEN_DEV_UID="$(id -u)" HABEN_DEV_GID="$(id -g)" docker compose up -d --build
      - name: Prüfen
        run: |
          for i in $(seq 1 90); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 2; done
          curl -sf -o /dev/null http://localhost:3000/login
          docker compose logs app | grep -q "Migrationen angewendet"
          docker compose logs app | grep -q "Einrichtungscode"
          sh deploy/tests/rollen-pruefen.sh "$(docker compose ps -q app)"
          docker compose exec -T --user bun app sh deploy/tests/rollen-env.sh
      - if: failure()
        run: docker compose logs

  backup:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' && needs.changes.outputs.deploy != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    env:
      COMPOSE_PROJECT_NAME: haben-ci-backup
      COMPOSE_FILE: compose.yml:tests/rollen-db-compose.yml
      DATABASE_URL: postgres://haben_app:ci_app@localhost:5886/haben
      MIGRATION_DATABASE_URL: postgres://haben:haben@localhost:5886/haben
      DOMAIN: haben.test
      DB_PASSWORD: haben
      AUTH_SECRET: ci
      ENCRYPTION_KEY: ci
      RESTIC_PASSWORD: ci
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        working-directory: ${{ github.workspace }}
      - name: Images bauen
        run: |
          docker build -t tristanteu/haben-backup:latest -f backup/Containerfile backup
          docker build -t tristanteu/haben-db:latest -f db/Containerfile db
      # Mit der compose.yml der Nutzer: Backup, Daten ändern, Wiederherstellen, alter Stand ist zurück
      - name: Backup und Wiederherstellen
        run: |
          set -x
          docker compose up -d db backup
          # Einmalige Betreiber-Rollenanlage, danach derselbe Migrations-/Rechteweg wie beim App-Start.
          printf 'ci_app\nci_app\n' | docker compose exec -T db createuser -U haben --login --no-superuser --no-createdb --no-createrole --pwprompt haben_app
          bun ../apps/web/src/server/db/migrate.ts
          docker compose exec -T db psql -U haben_app -d haben -X -q < tests/rollen-db.sql
          docker compose exec -T db psql -U haben -d haben -qc "CREATE TABLE t (x text); INSERT INTO t VALUES ('vorher')"
          docker compose run --rm --no-deps -T --entrypoint sh restore -c 'mkdir -p /belege/ab && echo beleg > /belege/ab/cd && chown -R 1000:1000 /belege'
          # Ein Beleg unter seinem SHA-256 wie in der App, für die Stichprobe des Test-Restores
          sha="$(echo beleg | sha256sum | cut -d' ' -f1)"
          docker compose run --rm --no-deps -T --entrypoint sh restore -c "mkdir -p /belege/${sha:0:2} && echo beleg > /belege/${sha:0:2}/$sha"
          docker compose exec -T db psql -U haben -d haben -qc \
            "INSERT INTO documents (sha256, filename, mime_type, size, net, tax, gross) VALUES ('$sha', 'beleg.pdf', 'application/pdf', 6, 0, 0, 0)"
          docker compose exec -T backup backup.sh
          docker compose exec -T backup grep -q '^ok' /var/lib/haben-backup/status
          # Backup und der erste Test-Restore stehen als erfolgreich in der App
          test "$(docker compose exec -T db psql -U haben -d haben -Atc "SELECT string_agg(kind || '=' || ok, ',' ORDER BY id) FROM backup_status")" \
            = "backup=true,restore_check=true"
          docker compose exec -T db psql -U haben -d haben -Atc "SELECT message FROM backup_status WHERE kind = 'restore_check'" | grep -q ', 1 Datei,'
          test "$(docker compose exec -T db psql -U haben -d postgres -Atc "SELECT count(*) FROM pg_database WHERE datname LIKE 'haben\_restore\_check%'")" = 0
          docker compose exec -T db psql -U haben -d haben -qc "UPDATE t SET x = 'nachher'"
          docker compose run --rm --no-deps -T --entrypoint sh restore -c 'rm /belege/ab/cd && echo neu > /belege/neu'
          # Eine offene Verbindung wie die der laufenden App: der Restore bricht ab und ändert nichts
          docker compose exec -T -d db psql -U haben -d haben -c "SELECT pg_sleep(300)"
          active="SELECT count(*) FROM pg_stat_activity WHERE datname = 'haben' AND query LIKE '%pg_sleep(300)%' AND pid <> pg_backend_pid()"
          for _ in $(seq 20); do [ "$(docker compose exec -T db psql -U haben -d postgres -Atc "$active")" = 1 ] && break; sleep 0.5; done
          if echo ja | docker compose run --rm -T restore latest 2> restore.err; then exit 1; fi
          grep -q 'noch Verbindungen offen' restore.err
          test "$(docker compose exec -T db psql -U haben -d haben -Atc 'SELECT x FROM t')" = nachher
          docker compose exec -T db psql -U haben -d postgres -qAtc \
            "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'haben' AND query LIKE '%pg_sleep(300)%' AND pid <> pg_backend_pid()"
          echo ja | docker compose run --rm -T restore latest
          test "$(docker compose exec -T db psql -U haben -d haben -Atc 'SELECT x FROM t')" = vorher
          # pg_dump enthält ACLs, aber keine Rollendefinitionen. Die vorhandene App-Rolle behält ihre Grants.
          test "$(docker compose exec -T db psql -U haben_app -d haben -Atc "SELECT has_table_privilege(current_user, 'journal_entries', 'INSERT') AND has_sequence_privilege(current_user, 'audit_log_id_seq', 'USAGE')")" = t
          # Wie beim anschließenden App-Start: Datenbankrechte werden nach dem Restore erneut gesetzt.
          bun ../apps/web/src/server/db/migrate.ts
          docker compose exec -T db psql -U haben_app -d haben -X -q < tests/rollen-db.sql
          docker compose run --rm --no-deps -T --entrypoint sh restore -c \
            'test "$(cat /belege/ab/cd)" = beleg && test ! -e /belege/neu && test "$(stat -c %u /belege/ab/cd)" = 1000'
          # Wie im Helm-Chart: restore.sh als Nutzer 1000; den Wurzelordner des Volumes legt Kubernetes mit fsGroup als
          # root:1000 an, das Repository gehört nach dem Schritt aus docs/kubernetes.md (Updates) dem Nutzer 1000
          docker compose run --rm --no-deps -T --entrypoint sh restore -c \
            'chown 0:1000 /belege && chmod 2775 /belege && chown -R 1000:1000 /backups && rm /belege/ab/cd'
          docker compose exec -T db psql -U haben -d haben -qc "UPDATE t SET x = 'nachher'"
          echo ja | docker compose run --rm -T --user 1000:1000 -e HOME=/tmp restore latest
          test "$(docker compose exec -T db psql -U haben -d haben -Atc 'SELECT x FROM t')" = vorher
          docker compose run --rm --no-deps -T --entrypoint sh restore -c \
            'test "$(cat /belege/ab/cd)" = beleg && test "$(stat -c %u:%g /belege/ab/cd)" = 1000:1000'
      - if: failure()
        run: docker compose logs

  # Ein Bestand von postgres:16 (compose.yml bis Haben 0.2) unter dem neuen Backup-Image und danach
  # das automatische Upgrade durch haben-db beim Start, mit der compose.yml der Nutzer
  db-upgrade:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' && needs.changes.outputs.deploy != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    env:
      COMPOSE_PROJECT_NAME: haben-ci-db-upgrade
      COMPOSE_FILE: compose.yml:tests/rollen-db-compose.yml
      DATABASE_URL: postgres://haben_app:ci_app@localhost:5886/haben
      MIGRATION_DATABASE_URL: postgres://haben:haben@localhost:5886/haben
      DOMAIN: haben.test
      DB_PASSWORD: haben
      AUTH_SECRET: ci
      ENCRYPTION_KEY: ci
      RESTIC_PASSWORD: ci
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        working-directory: ${{ github.workspace }}
      - name: Images bauen
        run: |
          docker build -t tristanteu/haben-backup:latest -f backup/Containerfile backup
          docker build -t tristanteu/haben-db:latest -f db/Containerfile db
      - name: Upgrade von PostgreSQL 16
        run: |
          set -x
          printf 'services:\n  db:\n    image: postgres:16\n' > alt.yml
          docker compose -f compose.yml -f tests/rollen-db-compose.yml -f alt.yml up -d db backup
          printf 'ci_app\nci_app\n' | docker compose exec -T db createuser -U haben --login --no-superuser --no-createdb --no-createrole --pwprompt haben_app
          bun ../apps/web/src/server/db/migrate.ts
          docker compose exec -T db psql -U haben_app -d haben -X -q < tests/rollen-db.sql
          docker compose exec -T db psql -U haben -d haben -qc "CREATE TABLE t (x text); INSERT INTO t VALUES ('vorher')"
          # Das Backup-Image mit pg_dump 19 sichert die Datenbank 16 mit pg_dump 16; sonst scheitert der
          # Test-Restore am Einspielen in die Datenbank 16
          docker compose exec -T backup backup.sh
          test "$(docker compose exec -T db psql -U haben -d haben -Atc "SELECT string_agg(kind || '=' || ok, ',' ORDER BY id) FROM backup_status")" \
            = "backup=true,restore_check=true"
          # Kein sauberes Herunterfahren, wie nach einem Absturz
          docker compose kill db
          docker compose up -d db backup
          docker compose logs db | grep -q "Upgrade auf PostgreSQL 19 fertig"
          test "$(docker compose exec -T db psql -U haben -d haben -Atc "SELECT current_setting('server_version_num')::int / 10000")" = 19
          test "$(docker compose exec -T db psql -U haben -d haben -Atc 'SELECT x FROM t')" = vorher
          # Rollen und Rechte stammen aus dem Cluster-Upgrade, nicht aus einer erneuten Rollenanlage.
          docker compose exec -T db psql -U haben_app -d haben -X -q < tests/rollen-db.sql
          # Der alte Bestand liegt unverändert daneben, der neue in 19/docker
          docker compose exec -T db test -s /var/lib/postgresql/data/16/docker/PG_VERSION
          docker compose exec -T db test ! -e /var/lib/postgresql/data/PG_VERSION
          # Ein Neustart aktualisiert nicht noch einmal
          docker compose restart db
          docker compose up -d --wait db
          test "$(docker compose logs db | grep -c 'Aktualisiere die Datenbank')" = 1
          # Backup und Test-Restore nach dem Upgrade
          docker compose exec -T backup backup.sh
          docker compose exec -T backup restore-check.sh
          test "$(docker compose exec -T db psql -U haben -d haben -Atc "SELECT string_agg(kind || '=' || ok, ',' ORDER BY id) FROM backup_status")" \
            = "backup=true,restore_check=true,backup=true,restore_check=true"
      # Eine eigene Datenbank kann neuer sein als haben-db (etwa im Kubernetes-Cluster): pg_dump 18 bricht an
      # einem Server 19 ab, das Backup-Image bringt deshalb auch das pg_dump dieser Version mit
      - name: Backup einer Datenbank 19
        env:
          HABEN_TEST_DB_IMAGE: postgres:19
        run: |
          set -x
          docker compose down -v
          # postgres ab 18 legt die Daten unter /var/lib/postgresql/<Version>/docker ab, compose.yml hängt das Volume
          # für haben-db aber unter /var/lib/postgresql/data ein
          printf 'services:\n  db:\n    environment:\n      PGDATA: /var/lib/postgresql/data/19\n' > neu.yml
          docker compose -f compose.yml -f tests/rollen-db-compose.yml -f neu.yml up -d --wait db
          docker compose -f compose.yml -f tests/rollen-db-compose.yml -f neu.yml up -d backup
          test "$(docker compose exec -T db psql -U haben -d haben -Atc "SELECT current_setting('server_version_num')::int / 10000")" = 19
          printf 'ci_app\nci_app\n' | docker compose exec -T db createuser -U haben --login --no-superuser --no-createdb --no-createrole --pwprompt haben_app
          bun ../apps/web/src/server/db/migrate.ts
          docker compose exec -T backup backup.sh
          test "$(docker compose exec -T db psql -U haben -d haben -Atc "SELECT string_agg(kind || '=' || ok, ',' ORDER BY id) FROM backup_status")" \
            = "backup=true,restore_check=true"
      - if: failure()
        run: docker compose logs

  # Die Vorlage für Synology (deploy/synology/compose.yml): Schlüssel erzeugen, App starten, Backup und
  # Wiederherstellen ohne .env; ein Neustart behält die Schlüssel
  synology:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' && needs.changes.outputs.deploy != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/synology
    steps:
      - uses: actions/checkout@v7
      - name: Images bauen
        run: |
          docker build -t tristanteu/haben-backup:latest -f ../backup/Containerfile ../backup
          docker build -t tristanteu/haben-db:latest -f ../db/Containerfile ../db
      - name: Starten, sichern, wiederherstellen
        run: |
          set -x
          docker compose up -d --wait db app
          docker compose up -d backup
          docker logs haben-schluessel | grep -q '^ENCRYPTION_KEY='
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3000/login && break; sleep 2; done
          curl -sf -o /dev/null http://127.0.0.1:3000/login
          docker logs haben-app 2>&1 | grep -q "Einrichtungscode"
          vorher="$(docker logs haben-schluessel | grep '^ENCRYPTION_KEY=' | tail -n1)"
          docker compose exec -T backup backup.sh
          test "$(docker compose exec -T db psql -U haben -d haben -Atc "SELECT string_agg(kind || '=' || ok, ',' ORDER BY id) FROM backup_status")" \
            = "backup=true,restore_check=true"
          docker compose exec -T db psql -U haben -d haben -qc "CREATE TABLE t (x text)"
          docker compose stop app
          echo ja | docker compose run --rm -T restore latest
          test "$(docker compose exec -T db psql -U haben -d haben -Atc "SELECT to_regclass('t') IS NULL")" = t
          docker compose down
          docker compose up -d --wait db app
          test "$(docker logs haben-schluessel | grep '^ENCRYPTION_KEY=' | tail -n1)" = "$vorher"
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3000/login && break; sleep 2; done
          curl -sf -o /dev/null http://127.0.0.1:3000/login
      - if: failure()
        run: docker compose logs
